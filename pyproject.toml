[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-avp"
version = "0.0.0"
description = "Vision-Language Navigation with Action/Verification Pipeline (VLN-AVP) - Intelligence-side pipeline over Agent-Kernel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vln", "vln.ipc", "vln.client", "vln.intent", "vln.nav", "vln.planning_ltm", "vln.vlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: end-to-end tests that spawn a host process over the NDJSON protocol",
]
